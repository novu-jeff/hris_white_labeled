# If using this as reference for the live site (e.g. ess.novulutions.com), ensure
# no HTML injection (sub_filter, add_before_body, etc.) is applied. See docs/INJECTION-SOURCE-CHECK.md.
server {
    listen 8000;
    server_name _;

    root /var/www/html/hris_white_labeled/public;
    index index.php index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Disable direct access to high-risk admin/debug utilities.
    location ~* ^/(adminer(?:/.*)?|adminer\.php|phpinfo\.php)$ {
        return 404;
    }

    # Block PHP execution from the public storage path.
    location ~* ^/storage/.*\.php$ {
        return 403;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
